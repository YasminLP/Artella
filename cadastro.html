<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <title>Criar Conta - Artella</title>
      <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <div class="container">
        <h2>Criar Conta</h2>
        <form onsubmit="cadastrar(event)">
          <img src="logo_amarelo.png" alt="Logo Artella">

          <input type="text" id="cadNome" placeholder="Nome" required>
          <input type="email" id="cadEmail" placeholder="E-mail" required>
          <input type="text" id="cadUsuario" placeholder="Nome de usuário" required>
          <input type="password" id="cadSenha" placeholder="Senha" required>
          <input type="password" id="cadConfSenha" placeholder="Confirmar senha" required>
          <button type="submit">Criar</button>
        </form>
    </div>
  </body>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="cadastro.js"></script>
</html>
