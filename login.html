<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar - Artella</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // Authenticate against the Realtime Database 'usuarios' node
    function login(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const senha = document.getElementById("loginSenha").value;

      // Read the usuarios node and look for a matching email + senha
      db.ref('usuarios').once('value')
        .then(snapshot => {
          const usuariosObj = snapshot.val();
          let usuarioEncontrado = null;

          if (usuariosObj) {
            // usuariosObj is an object keyed by push ids
            Object.values(usuariosObj).forEach(u => {
              if (u.email === email && u.senha === senha) {
                usuarioEncontrado = u;
              }
            });
          }

          if (usuarioEncontrado) {
            localStorage.setItem("usuarioLogado", JSON.stringify(usuarioEncontrado));
            alert("Login realizado com sucesso!");
            window.location.href = "desafios.html";
          } else {
            alert("E-mail ou senha inválidos!");
          }
        })
        .catch(error => {
          console.error('Erro ao acessar Firebase:', error);
          alert('Erro ao acessar a base de dados. Veja o console para mais detalhes.');
        });
    }
  </script>
</head>
<body class="login-bg">
<header class="header-bege">
  <a href="cadastro.html">Criar Conta</a>
</header>

<div class="container">
  <img src="logo_azul.png" alt="Logo Artella" class="logo">
  <form onsubmit="login(event)">
    <input type="email" id="loginEmail" placeholder="E-mail" required>
    <input type="password" id="loginSenha" placeholder="Senha" required>
    <a href="redefinir.html" class="reset-link">Redefinir senha</a>
    <button type="submit" class="btn-rosa">Entrar</button>
  </form>
</div>
</body>
</html>
